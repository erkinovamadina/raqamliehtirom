<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raqamli Ehtirom - Angren Universiteti</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --danger-color: #ef4444;
      --success-color: #10b981;
    }

    [data-theme="dark"] {
      --primary-color: #3b82f6;
      --primary-hover: #60a5fa;
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding-bottom: 60px; }
    
    header { background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; padding: 1rem 2rem; }
    .header-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.25rem; color: var(--primary-color); }
    .nav-actions { display: flex; align-items: center; gap: 12px; }

    .btn { padding: 8px 16px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-size: 0.9rem; }
    .btn-primary { background-color: var(--primary-color); color: white; }
    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
    .btn-icon { padding: 8px; border-radius: 50%; width: 40px; height: 40px; justify-content: center; }

    .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
    .hero { text-align: center; margin-bottom: 3rem; }
    .hero h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--text-main); }
    .hero p { color: var(--text-muted); font-size: 1.1rem; }

    .search-box { margin: 2rem auto; max-width: 600px; position: relative; }
    .search-box input { width: 100%; padding: 12px 20px 12px 45px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 1rem; outline: none; }
    .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

    .section-title { font-size: 1.5rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 10px; }

    .top-teachers { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
    .top-card { background: var(--card-bg); border-radius: 16px; padding: 1.5rem; border: 2px solid #f59e0b; display: flex; align-items: center; gap: 1rem; position: relative; overflow: hidden; }
    .top-badge { position: absolute; top: 0; right: 0; background: #f59e0b; color: white; padding: 4px 12px; border-bottom-left-radius: 12px; font-weight: 700; font-size: 0.8rem; }

    .teachers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .teacher-card { background: var(--card-bg); border-radius: 16px; padding: 1.5rem; border: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; text-align: center; }
    .avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--primary-color); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 700; margin-bottom: 1rem; }
    .teacher-name { font-weight: 700; font-size: 1.1rem; margin-bottom: 0.25rem; }
    .teacher-dept { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem; }

    .card-actions { display: flex; gap: 10px; width: 100%; margin-top: auto; }
    .btn-like { flex: 1; border: 1px solid var(--border-color); background: transparent; color: var(--text-main); border-radius: 8px; padding: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 1rem; }
    .modal-content { background: var(--card-bg); border-radius: 16px; width: 100%; max-width: 500px; padding: 2rem; position: relative; max-height: 90vh; overflow-y: auto; }
    .close-modal { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-main); outline: none; }

    .wishes-list { margin-top: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    .wish-item { background: var(--bg-color); border-radius: 8px; padding: 1rem; border: 1px solid var(--border-color); }
    .wish-author { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.25rem; color: var(--primary-color); }
    .wish-text { font-size: 0.95rem; }
    .wish-media { margin-top: 0.5rem; max-width: 100%; border-radius: 8px; }

    .admin-panel { display: none; margin-top: 3rem; background: var(--card-bg); border-radius: 16px; padding: 2rem; border: 1px solid var(--border-color); }
    .admin-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-bottom: 1px solid var(--border-color); }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="logo">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>Angren Universiteti</span>
      </div>
      <div class="nav-actions">
        <button class="btn btn-outline btn-icon" id="themeToggle"><i class="fa-solid fa-moon"></i></button>
        <button class="btn btn-outline" id="adminBtn"><i class="fa-solid fa-lock"></i> Tasdiqlash Paneli</button>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="hero">
      <h1>Raqamli Ehtirom</h1>
      <p>Ustozlarimizga bo'lgan samimiy minnatdorchiligingizni raqamli shaklda bildiring</p>
      
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Ustozning ismi yoki kafedrasi bo'yicha qidiruv...">
      </div>
    </div>

    <div id="topSection">
      <h2 class="section-title"><i class="fa-solid fa-trophy" style="color:#f59e0b;"></i> TOP 3 E'tirof Etilgan Ustozlar</h2>
      <div class="top-teachers" id="topTeachersGrid"></div>
    </div>

    <h2 class="section-title"><i class="fa-solid fa-users"></i> Barcha Ustozlar</h2>
    <div class="teachers-grid" id="teachersGrid"></div>

    <div class="admin-panel" id="adminPanel">
      <h2 class="section-title"><i class="fa-solid fa-shield-halved"></i> Tasdiqlash Paneli (Kutilayotgan tabriklar)</h2>
      <div id="pendingWishesList"></div>
    </div>
  </div>

  <!-- Wish Modal -->
  <div class="modal" id="wishModal">
    <div class="modal-content">
      <button class="close-modal" id="closeWishModal">&times;</button>
      <h3 id="modalTeacherName" style="margin-bottom: 1rem;"></h3>
      
      <form id="wishForm">
        <input type="hidden" id="selectedTeacherId">
        <div class="form-group">
          <label>Ismingiz (ixtiyoriy)</label>
          <input type="text" id="studentName" placeholder="Talaba">
        </div>
        <div class="form-group">
          <label>Ehtirom so'zlaringiz va dil izhoringiz</label>
          <textarea id="wishText" rows="4" required placeholder="Ustozga dil izhoringizni yozing..."></textarea>
        </div>
        <div class="form-group">
          <label>Rasm yuklash (ixtiyoriy)</label>
          <input type="file" id="wishPhoto" accept="image/*">
        </div>
        <div class="form-group">
          <label>Ovozli xabar yuklash (ixtiyoriy)</label>
          <input type="file" id="wishAudio" accept="audio/*">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Yuborish (Tasdiqlashga)</button>
      </form>

      <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid var(--border-color);">
      <h4>Tasdiqlangan tabriklar</h4>
      <div class="wishes-list" id="approvedWishesList"></div>
    </div>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBA1TxG83DB0xKmZLMHNQ_yue1qbAHsKBw",
      authDomain: "raqamliehtirom.firebaseapp.com",
      databaseURL: "https://raqamliehtirom-default-rtdb.firebaseio.com",
      projectId: "raqamliehtirom",
      storageBucket: "raqamliehtirom.firebasestorage.app",
      messagingSenderId: "646201230706",
      appId: "1:646201230706:web:df86413a182ebd657809eb",
      measurementId: "G-VK507MT7JF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const initialTeachers = [
      { id: "1", name: "Prof. Alimov Anvar", dept: "Axborot Texnologiyalari", likes: 0 },
      { id: "2", name: "Doc. Karimova Nargiza", dept: "Xorijiy Tillar", likes: 0 },
      { id: "3", name: "Dr. Rahimov Sardor", dept: "Oliy Matematika", likes: 0 },
      { id: "4", name: "Toshmatova Zilola", dept: "Iqtisodiyot va Moliya", likes: 0 },
      { id: "5", name: "Sultonov Jamshid", dept: "Fizika va Muhandislik", likes: 0 }
    ];

    let teachersData = {};
    let wishesData = {};

    const teachersGrid = document.getElementById('teachersGrid');
    const topTeachersGrid = document.getElementById('topTeachersGrid');
    const searchInput = document.getElementById('searchInput');
    const wishModal = document.getElementById('wishModal');
    const wishForm = document.getElementById('wishForm');
    const approvedWishesList = document.getElementById('approvedWishesList');
    const adminBtn = document.getElementById('adminBtn');
    const adminPanel = document.getElementById('adminPanel');
    const pendingWishesList = document.getElementById('pendingWishesList');

    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      const current = document.body.getAttribute('data-theme');
      if(current === 'dark') {
        document.body.removeAttribute('data-theme');
        themeToggle.innerHTML = '<i class="fa-solid fa-moon"></i>';
      } else {
        document.body.setAttribute('data-theme', 'dark');
        themeToggle.innerHTML = '<i class="fa-solid fa-sun"></i>';
      }
    });

    const teachersRef = ref(db, 'teachers');
    onValue(teachersRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) {
        initialTeachers.forEach(t => {
          set(ref(db, 'teachers/' + t.id), t);
        });
      } else {
        teachersData = data;
        renderTeachers();
      }
    });

    const wishesRef = ref(db, 'wishes');
    onValue(wishesRef, (snapshot) => {
      wishesData = snapshot.val() || {};
      renderTeachers();
      renderPendingWishes();
      
      const currentModalId = document.getElementById('selectedTeacherId').value;
      if (currentModalId) {
        renderApprovedWishes(currentModalId);
      }
    });

    function getInitials(name) {
      return name.replace(/^(Prof\.|Doc\.|Dr\.)\s*/, '').split(' ').map(n => n[0]).join('');
    }

    function renderTeachers() {
      const searchTerm = searchInput.value.toLowerCase();
      const teachersArray = Object.values(teachersData);

      const sorted = [...teachersArray].sort((a, b) => (b.likes || 0) - (a.likes || 0));
      const top3 = sorted.filter(t => (t.likes || 0) > 0).slice(0, 3);

      topTeachersGrid.innerHTML = '';
      if(top3.length === 0) {
        document.getElementById('topSection').style.display = 'none';
      } else {
        document.getElementById('topSection').style.display = 'block';
        top3.forEach((t, index) => {
          topTeachersGrid.innerHTML += `
            <div class="top-card">
              <div class="top-badge">#${index + 1} TOP</div>
              <div class="avatar">${getInitials(t.name)}</div>
              <div>
                <div class="teacher-name">${t.name}</div>
                <div class="teacher-dept">${t.dept}</div>
                <div style="font-weight:700; color:var(--primary-color);"><i class="fa-solid fa-heart"></i> ${t.likes || 0} Ehtirom</div>
              </div>
            </div>
          `;
        });
      }

      teachersGrid.innerHTML = '';
      teachersArray.filter(t => t.name.toLowerCase().includes(searchTerm) || t.dept.toLowerCase().includes(searchTerm))
        .forEach(t => {
          teachersGrid.innerHTML += `
            <div class="teacher-card">
              <div class="avatar">${getInitials(t.name)}</div>
              <div class="teacher-name">${t.name}</div>
              <div class="teacher-dept">${t.dept}</div>
              <div class="card-actions">
                <button class="btn-like" onclick="window.likeTeacher('${t.id}')">
                  <i class="fa-solid fa-heart"></i> <span>${t.likes || 0}</span>
                </button>
                <button class="btn btn-primary" onclick="window.openWishModal('${t.id}')">
                  <i class="fa-solid fa-pen"></i> Ehtirom
                </button>
              </div>
            </div>
          `;
        });
    }

    searchInput.addEventListener('input', renderTeachers);

    window.likeTeacher = function(id) {
      const currentLikes = (teachersData[id] && teachersData[id].likes) ? teachersData[id].likes : 0;
      update(ref(db, 'teachers/' + id), { likes: currentLikes + 1 });
    };

    window.openWishModal = function(id) {
      const teacher = teachersData[id];
      document.getElementById('selectedTeacherId').value = id;
      document.getElementById('modalTeacherName').innerText = teacher.name + " ustozga ehtirom bildirishingiz mumkin";
      renderApprovedWishes(id);
      wishModal.style.display = 'flex';
    };

    document.getElementById('closeWishModal').addEventListener('click', () => {
      wishModal.style.display = 'none';
      document.getElementById('selectedTeacherId').value = '';
    });

    function renderApprovedWishes(teacherId) {
      approvedWishesList.innerHTML = '';
      Object.values(wishesData).filter(w => w.teacherId === teacherId && w.status === 'approved')
        .forEach(w => {
          let mediaHtml = '';
          if(w.photo) mediaHtml += `<img src="${w.photo}" class="wish-media">`;
          if(w.audio) mediaHtml += `<audio controls src="${w.audio}" class="wish-media"></audio>`;

          approvedWishesList.innerHTML += `
            <div class="wish-item">
              <div class="wish-author">${w.author || 'Talaba'}</div>
              <div class="wish-text">${w.text}</div>
              ${mediaHtml}
            </div>
          `;
        });
    }

    wishForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const teacherId = document.getElementById('selectedTeacherId').value;
      const author = document.getElementById('studentName').value || 'Talaba';
      const text = document.getElementById('wishText').value;
      const photoFile = document.getElementById('wishPhoto').files[0];
      const audioFile = document.getElementById('wishAudio').files[0];

      let photoBase64 = null;
      let audioBase64 = null;

      if(photoFile) photoBase64 = await toBase64(photoFile);
      if(audioFile) audioBase64 = await toBase64(audioFile);

      const newWishRef = push(ref(db, 'wishes'));
      await set(newWishRef, {
        id: newWishRef.key,
        teacherId,
        author,
        text,
        photo: photoBase64,
        audio: audioBase64,
        status: 'pending',
        createdAt: Date.now()
      });

      alert('Ehtiromingiz yuborildi! Tasdiqlash panelidan so\'ng saytda ko\'rinadi.');
      wishForm.reset();
      wishModal.style.display = 'none';
    });

    const toBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });

    adminBtn.addEventListener('click', () => {
      const pass = prompt('Tasdiqlash paneli parolini kiriting:');
      if(pass === 'Madina200@') {
        adminPanel.style.display = 'block';
        window.scrollTo({ top: adminPanel.offsetTop - 80, behavior: 'smooth' });
      } else if(pass !== null) {
        alert('Parol noto\'g\'ri!');
      }
    });

    function renderPendingWishes() {
      pendingWishesList.innerHTML = '';
      const pending = Object.values(wishesData).filter(w => w.status === 'pending');
      if(pending.length === 0) {
        pendingWishesList.innerHTML = '<p style="color:var(--text-muted);">Kutilayotgan tabriklar yo\'q.</p>';
        return;
      }

      pending.forEach(w => {
        const teacher = teachersData[w.teacherId] || {};
        pendingWishesList.innerHTML += `
          <div class="admin-item">
            <div>
              <strong>Kimga:</strong> ${teacher.name || 'Ustoz'}<br>
              <strong>Muallif:</strong> ${w.author}<br>
              <strong>Matn:</strong> ${w.text}
            </div>
            <div style="display:flex; gap:8px;">
              <button class="btn btn-primary" onclick="window.approveWish('${w.id}')"><i class="fa-solid fa-check"></i> Tasdiqlash</button>
              <button class="btn btn-outline" style="color:var(--danger-color);" onclick="window.rejectWish('${w.id}')"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;
      });
    }

    window.approveWish = function(wishId) {
      update(ref(db, 'wishes/' + wishId), { status: 'approved' });
    };

    window.rejectWish = function(wishId) {
      set(ref(db, 'wishes/' + wishId), null);
    };
  </script>
</body>
</html>
